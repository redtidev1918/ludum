name: Publish

# Publishes to npm via Trusted Publisher (OIDC / provenance), no npm token stored.
# Trigger by pushing a version tag, e.g.: git tag v3.0.0-alpha.1 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm provenance (Trusted Publisher)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://registry.npmjs.org" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); print(base64.urlsafe_b64decode(s).decode())" | jq '{sub, iss, aud, repository, repository_owner, workflow_ref, job_workflow_ref, ref, environment}'

      - name: Publish
        # Prereleases (3.0.0-alpha.2 -> tag alpha) use their prerelease id; stable uses latest.
        run: |
          DIST_TAG=$(node -p "const v=require('./package.json').version; v.includes('-') ? v.split('-')[1].split('.')[0] : 'latest'")
          npm publish --provenance --access public --tag "$DIST_TAG"
