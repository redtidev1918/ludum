name: Publish

# Publishes to npm via Trusted Publisher (OIDC / provenance), no npm token stored.
# Trigger by pushing a version tag, e.g.: git tag v3.0.0-alpha.1 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm provenance (Trusted Publisher)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Publish
        # Prereleases (3.0.0-alpha.2 -> tag alpha) use their prerelease id; stable uses latest.
        run: npm publish --provenance --access public --tag $(node -p "const v=require('./package.json').version; v.includes('-') ? v.split('-')[1].split('.')[0] : 'latest'")
