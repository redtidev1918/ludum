name: Ops - Deprecate broken 3.1.0
# 一次性维护: 弃用 npm 上不完整的 ludum@3.1.0(缺 dist)。执行后即删本 workflow。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to deprecate"
        required: false
        default: "3.1.0"

permissions:
  contents: write

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Deprecate ${{ inputs.version }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          # npm writes the .npmrc auth from NODE_AUTH_TOKEN for the configured registry.
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          npm deprecate "ludum@${{ inputs.version }}" \
            "This version shipped without dist/ (bare package: imports of 'ludum/xxx' fail). Upgrade to >=3.1.1 which is complete." \
            --registry=https://registry.npmjs.org/ 2>&1 | tail -8
          echo "deprecate exit=$?"
      - name: Verify deprecation
        shell: bash
        run: |
          out=$(npm view "ludum@${{ inputs.version }}" deprecated --registry=https://registry.npmjs.org/ 2>&1)
          echo "Deprecation status for ${{ inputs.version }}:"
          echo "$out"
          printf '%s' "$out" | grep -qi 'upgrade to >=3.1.1' && echo "CONFIRMED ✓" || echo "NOT confirmed"